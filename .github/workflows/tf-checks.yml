name: tf-checks
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
jobs:
  # Only examples/complete is checked here. It is the one example that stands
  # alone, because it builds its own VPC, subnets, and SSM endpoints. The other
  # four take an existing vpc_id and subnet_ids with no defaults, so they cannot
  # plan unattended. They are covered by the fmt and validate pass in
  # pre-commit.
  tf-checks-complete-example:
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './examples/complete/'
      provider: none
