name: tfsec
permissions: write-all
on:
  pull_request:
  workflow_dispatch:
jobs:
  # security-tfsec.yml, not tfsec.yml. The shared repository renamed it, and
  # callers still pointing at the old path fail at startup with a workflow parse
  # error rather than a test failure.
  tfsec:
    uses: clouddrove/github-shared-workflows/.github/workflows/security-tfsec.yml@master
    secrets: inherit
    with:
      working_directory: '.'
