# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "approvers"
  - package-ecosystem: "terraform"
    directory: "examples/complete"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "approvers"
  - package-ecosystem: "terraform"
    directory: "examples/basic"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "approvers"
  - package-ecosystem: "terraform"
    directory: "examples/with-targets"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "approvers"
  - package-ecosystem: "terraform"
    directory: "examples/session-transcripts"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "approvers"
  - package-ecosystem: "terraform"
    directory: "examples/minimal"
    schedule:
      interval: "weekly"
    assignees:
      - "clouddrove-ci"
    reviewers:
      - "approvers"
