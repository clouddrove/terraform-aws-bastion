<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#232f3e"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3f8624"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="700" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#232f3e">SSM Jump Host — private access from localhost (no inbound, no keys)</text>

  <!-- ================= USER ================= -->
  <g>
    <circle cx="360" cy="86" r="16" fill="#5a6b86"/>
    <path d="M336,120 a24,20 0 0 1 48,0 z" fill="#5a6b86"/>
    <text x="360" y="150" font-size="12" text-anchor="middle" fill="#232f3e">Your laptop (localhost)</text>
    <text x="360" y="165" font-size="10" text-anchor="middle" fill="#666">tunnel.sh · local HAProxy SNI (:443/:5432) · kubectl/psql/redis-cli</text>
  </g>

  <!-- ================= AWS API ================= -->
  <g>
    <rect x="520" y="66" width="120" height="72" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
    <text x="580" y="104" font-size="22" font-weight="bold" text-anchor="middle" fill="#232f3e">aws</text>
    <path d="M560,112 q20,10 40,0" stroke="#ff9900" stroke-width="3" fill="none"/>
    <text x="580" y="156" font-size="12" text-anchor="middle" fill="#232f3e">AWS API</text>
  </g>

  <!-- ================= IAM ================= -->
  <g>
    <rect x="740" y="150" width="72" height="72" rx="8" fill="#c7131f"/>
    <rect x="762" y="180" width="28" height="20" rx="2" fill="#ffffff"/>
    <path d="M766,180 v-6 a10,10 0 0 1 20,0 v6" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="776" cy="189" r="3" fill="#c7131f"/>
    <text x="776" y="238" font-size="11" text-anchor="middle" fill="#232f3e">AWS Identity &amp; Access</text>
    <text x="776" y="252" font-size="11" text-anchor="middle" fill="#232f3e">Management (IAM)</text>
  </g>

  <!-- ================= SYSTEMS MANAGER ================= -->
  <g>
    <rect x="740" y="430" width="72" height="72" rx="8" fill="#e7157b"/>
    <path d="M776,448 a18,18 0 1 0 0.1,0 z" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="776" cy="466" r="5" fill="#ffffff"/>
    <path d="M776,450 v-6 M776,482 v6 M760,466 h-6 M792,466 h6" stroke="#ffffff" stroke-width="3"/>
    <text x="776" y="518" font-size="11" text-anchor="middle" fill="#232f3e">AWS Systems</text>
    <text x="776" y="532" font-size="11" text-anchor="middle" fill="#232f3e">Manager</text>
  </g>

  <!-- ================= VPC ================= -->
  <rect x="40" y="230" width="620" height="430" rx="4" fill="none" stroke="#3f8624" stroke-width="2"/>
  <g>
    <rect x="52" y="242" width="26" height="26" rx="4" fill="#3f8624"/>
    <path d="M60,262 a7,6 0 0 1 12,-2 a5,5 0 0 1 -2,10 h-8 a5,5 0 0 1 -2,-8 z" fill="#ffffff"/>
  </g>
  <text x="86" y="260" font-size="13" font-weight="bold" fill="#3f8624">Virtual Private Cloud (private)</text>

  <!-- ================= PRIVATE SUBNET ================= -->
  <rect x="70" y="300" width="560" height="330" rx="4" fill="#e9f3fa" stroke="#147eba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g>
    <rect x="82" y="312" width="26" height="26" rx="4" fill="#147eba"/>
    <rect x="90" y="326" width="10" height="8" rx="1" fill="#ffffff"/>
    <path d="M91,326 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="116" y="330" font-size="13" font-weight="bold" fill="#147eba">Private Subnets (multi-AZ)</text>


  <!-- ================= PRIVATE RESOURCES (ALB/EKS/RDS/Redis) ================= -->
  <g>
    <rect x="100" y="440" width="72" height="72" rx="8" fill="#8c4fff"/>
    <circle cx="136" cy="462" r="5" fill="#ffffff"/>
    <circle cx="120" cy="490" r="5" fill="#ffffff"/>
    <circle cx="136" cy="490" r="5" fill="#ffffff"/>
    <circle cx="152" cy="490" r="5" fill="#ffffff"/>
    <path d="M136,467 v8 M136,475 h-16 v10 M136,475 h16 v10 M136,475 v10" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="136" y="528" font-size="10.5" text-anchor="middle" fill="#232f3e">Private resources:</text>
    <text x="136" y="542" font-size="10.5" text-anchor="middle" fill="#232f3e">EKS / RDS / Redis /</text>
    <text x="136" y="556" font-size="10.5" text-anchor="middle" fill="#232f3e">Internal ALB</text>
  </g>

  <!-- ================= EC2 JUMP HOST ================= -->
  <g>
    <rect x="320" y="440" width="72" height="72" rx="8" fill="#ed7100"/>
    <rect x="336" y="456" width="40" height="40" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M344,452 v-6 M356,452 v-6 M368,452 v-6 M344,500 v6 M356,500 v6 M368,500 v6 M332,464 h-6 M332,476 h-6 M380,464 h6 M380,476 h6" stroke="#ffffff" stroke-width="3"/>
    <text x="356" y="528" font-size="10.5" text-anchor="middle" fill="#232f3e">EC2 jump host</text>
    <text x="356" y="542" font-size="10.5" text-anchor="middle" fill="#232f3e">with SSM agent</text>
    <text x="356" y="556" font-size="10.5" text-anchor="middle" fill="#666">no key · no public IP</text>
  </g>

  <!-- ================= SSM ENDPOINT ================= -->
  <g>
    <rect x="470" y="440" width="72" height="72" rx="8" fill="#8c4fff"/>
    <circle cx="506" cy="476" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="506" cy="476" r="5" fill="#ffffff"/>
    <path d="M506,460 v-6 M506,492 v6 M490,476 h-6 M522,476 h6" stroke="#ffffff" stroke-width="3"/>
    <text x="506" y="528" font-size="10.5" text-anchor="middle" fill="#232f3e">SSM VPC</text>
    <text x="506" y="542" font-size="10.5" text-anchor="middle" fill="#232f3e">endpoints</text>
    <text x="506" y="556" font-size="10.5" text-anchor="middle" fill="#666">(no NAT)</text>
  </g>

  <!-- ================= EDGES ================= -->
  <!-- user -> AWS API -->
  <line x1="392" y1="86" x2="516" y2="98" stroke="#232f3e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- AWS API -> IAM (AuthN/AuthZ) -->
  <path d="M640,110 h120 v36" fill="none" stroke="#232f3e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="128" font-size="11" text-anchor="middle" fill="#232f3e">AuthN</text>
  <text x="700" y="142" font-size="11" text-anchor="middle" fill="#232f3e">AuthZ</text>
  <!-- user dashed -> EC2 : (1) SSM port-forward session (laptop -> jump host, via SSM) -->
  <path d="M360,170 v268" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="372" y="196" font-size="11" font-weight="bold" fill="#232f3e">(1) SSM port-forward session</text>
  <text x="372" y="211" font-size="11" fill="#232f3e">(laptop → jump host, via SSM)</text>
  <!-- EC2 -> ALB/targets : (2) relay TCP (label above the arrow, clear of the line) -->
  <line x1="318" y1="476" x2="174" y2="476" stroke="#232f3e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="464" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#232f3e">(2) relay TCP</text>
  <text x="246" y="500" font-size="10.5" text-anchor="middle" fill="#232f3e">443 / 5432 / 6379</text>
  <!-- EC2 -> SSM endpoint -->
  <line x1="392" y1="476" x2="468" y2="476" stroke="#232f3e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- SSM endpoint -> Systems Manager (reaches the SM box) -->
  <line x1="544" y1="476" x2="736" y2="476" stroke="#3f8624" stroke-width="2" marker-end="url(#arrowg)"/>
  <!-- Systems Manager -> IAM (auth) -->
  <line x1="776" y1="430" x2="776" y2="226" stroke="#232f3e" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="30" y="680" font-size="10.5" fill="#666">Data path: client → local HAProxy → SSM port-forward → jump host → target. HAProxy runs on the laptop; the jump host relays plain TCP to the target's private IP.</text>
  <text x="30" y="694" font-size="10.5" fill="#666">Green = SSM control channel via VPC endpoints (outbound only, IAM/SSO auth, no inbound, no NAT).  Dashed = SSM session; solid = TCP.</text>
</svg>
